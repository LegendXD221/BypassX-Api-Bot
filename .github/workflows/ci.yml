name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: for f in $(git ls-files 'src/**/*.js' 'scripts/*.js'); do node --check "$f"; done

      - name: Smoke test
        run: npm run smoke
